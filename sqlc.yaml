version: "2"
sql:
  - engine: "postgresql"
    queries: "sql/*.sql"
    schema: "migrations/*.sql"
    gen:
      go:
        package: "models"
        out: "internal/models/"
        sql_package: "pgx/v5"
        emit_prepared_queries: true
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_db_tags: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - { db_type: "timestamptz", nullable: true, go_type: { import: "time", type: "Time", pointer: true } }
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - { db_type: "uuid", nullable: true, go_type: { import: "github.com/google/uuid", type: "UUID", pointer: true } }
          - { db_type: "text", go_type: { type: "string" } }
          - { db_type: "text", nullable: true, go_type: { type: "string", pointer: true } }
          - { db_type: "date", go_type: { import: "time", type: "Time" } }
          - { db_type: "date", nullable: true, go_type: { import: "time", type: "Time", pointer: true } }
          - { db_type: "jsonb", go_type: { import: "encoding/json", type: "RawMessage" } }
          - { db_type: "pg_catalog.int4", go_type: { type: "int32" } }
          - { db_type: "pg_catalog.int4", nullable: true, go_type: { type: "int32", pointer: true } }
          - { db_type: "pg_catalog.int8", nullable: true, go_type: { type: "int64", pointer: true } }
          - { db_type: "pg_catalog.float8", nullable: true, go_type: { type: "float64", pointer: true } }
